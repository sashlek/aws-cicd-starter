---
- name: Clean up old repos, install Docker, and test
  hosts: app_servers
  become: true
  tasks:
    - name: Remove broken docker repo file if exists
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Remove broken docker list from sources.list if exists
      shell: rm -f /etc/apt/sources.list.d/*docker*
      ignore_errors: true

    - name: Update apt cache cleanly
      apt:
        update_cache: yes

    - name: Install Docker from Ubuntu official repositories
      apt:
        name: docker.io
        state: present

    - name: Ensure docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create web root directory on remote instance
      file:
        path: /opt/webapp
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy custom portfolio index.html
      copy:
        src: ../web/index.html
        dest: /opt/webapp/index.html

    - name: Remove existing test-web container if running
      shell: docker rm -f test-web || true

    - name: Run Nginx container with custom portfolio page
      shell: docker run -d --name test-web -p 80:80 -v /opt/webapp/index.html:/usr/share/nginx/html/index.html:ro --restart always nginx:alpine